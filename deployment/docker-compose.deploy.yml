services:
  glyph-bff:
    image: glyph/bff:latest
    container_name: glyph-bff
    ports:
      - "7004:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Urls__AuthServices=
      - Urls__UserManagementServices=
      - Urls__AssetsServices=
      - Urls__FileService=
      - Redis__ConnectionString=
    restart: unless-stopped
    depends_on:
      - glyph-assets-api
    networks:
      - glyph-network

  glyph-assets-api:
    image: glyph/assets-api:latest
    container_name: glyph-assets-api
    ports:
      - "7005:80" 
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Urls__FileService=
      - ConnectionStrings__DefaultConnection= <<Postgres_Sql>>
      - JwtSettings__Secret=
      - JwtSettings__Issuer=
      - JwtSettings__Audience=
    restart: unless-stopped
    networks:
      - glyph-network

  glyph-ui:
    image: glyph/ui:latest
    container_name: glyph-ui
    ports:
      - "7006:80"
    restart: unless-stopped
    networks:
      - glyph-network

networks:
  glyph-network:
    driver: bridge