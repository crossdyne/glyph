<div class="combobox-wrapper" [class.disabled]="disabled">
  <div class="combobox-input-container">
    <input
      type="text"
      class="combobox-input"
      [placeholder]="placeholder"
      [value]="searchText()"
      (input)="onInput($event)"
      (focus)="isOpen.set(true)"
      (blur)="onInputBlur()"
      [disabled]="disabled"
      autocomplete="off"
    />
    <button 
      type="button" 
      class="combobox-toggle" 
      (click)="toggleDropdown()" 
      [disabled]="disabled"
      tabindex="-1">
      ▼
    </button>
  </div>

  @if (isOpen() && filteredItems().length > 0) {
    <ul class="combobox-dropdown">
      @for (item of filteredItems(); track item) {
        <li 
          class="combobox-item"
          [class.selected]="item === selected()"
          (mousedown)="selectItem(item)">
          {{ item[displayKey] }}
        </li>
      }
    </ul>
  }
  
  @if (isOpen() && filteredItems().length === 0) {
    <div class="combobox-dropdown combobox-empty">
      Ничего не найдено
    </div>
  }
</div>
