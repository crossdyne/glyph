@if (loading()) {
    <div>Загрузка...</div>
}

@if (error()) {
    <div>{{ error() }}</div>
}

@if (categories().length > 0) {
    <ul>
        @for (category of categories(); track category.categoryId) {
            <li>{{category.categoryId}} - {{category.name}} - {{category.userId}}</li>
        } @empty {
            <li>Список пустой</li>
        }
    </ul>
}
