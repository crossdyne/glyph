<div class="categories-list-container">
    <h2>Категории</h2>

    @if (categories().length > 0) {
        <ul>
            @for (category of categories(); track category.categoryId) {
                <li>
                    <span class="category-name">{{ category.name }}</span> 
                    <div class="actions-container">
                        <edit-button (click)="onEdit(category.categoryId)" size="sm">
                            Редактировать
                        </edit-button>
                        <delete-button (click)="onDelete(category.categoryId)" size="sm">
                            Удалить
                        </delete-button>
                    </div>
                </li>
            }
        </ul>
    } @else {
        <p>Список пуст</p>
    }
</div>
