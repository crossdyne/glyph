<div 
  class="drop-zone" 
  [class.drag-over]="isDragOver()"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="openFilePicker()"
  (keydown.enter)="openFilePicker()"
  (keydown.space)="openFilePicker()"
  tabindex="0"
  role="button"
  aria-label="Зона для загрузки файла"
>
  <div class="drop-zone-content">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
      <path d="M11 14.9861C11 15.5384 11.4477 15.9861 12 15.9861C12.5523 15.9861 13 15.5384 13 14.9861V7.82831L16.2428 11.0711L17.657 9.65685L12.0001 4L6.34326 9.65685L7.75748 11.0711L11 7.82854V14.9861Z" />
      <path d="M4 14H6V18H18V14H20V18C20 19.1046 19.1046 20 18 20H6C4.89543 20 4 19.1046 4 18V14Z" />
    </svg>
    
    <p class="title">Перетащите файл сюда</p>
    <p class="subtitle">или <span class="link">нажмите для выбора</span></p>
    
    @if (accept()) {
      <p class="hint">
        Допустимый формат: {{ accept() }}
      </p>
    }
    
    @if (fileName()) {
      <p class="hint">
        Файл: <span class="file-name">{{ fileName() }}</span> 
      </p>
    }
  </div>
  
  <input 
    #fileInput
    type="file" 
    [accept]="accept()" 
    [multiple]="multiple()" 
    (change)="onFileInputChange($event)" 
    class="hidden-input"
  />
</div>
